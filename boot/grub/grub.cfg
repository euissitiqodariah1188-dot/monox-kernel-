# MONOX Kernel - GRUB2 Boot Configuration
#
# This config is for GRUB2 on ARM64 (UEFI or bare metal).
# Detects whether a full OS is present; if not, shows error
# since this is a kernel-only build.

set timeout=3
set default=0

# Color theme
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# -------------------------------------------------------
# Check for OS readiness
# Kernel-only mode: no userspace = boot error shown
# Full OS mode: boots normally
# -------------------------------------------------------
function check_os_ready {
    # Check for /usr/bin presence (indicates userspace is present)
    if [ -f /boot/monox-os-ready ]; then
        set os_ready=1
    else
        set os_ready=0
    fi
}

check_os_ready

# -------------------------------------------------------
# Menuentry: MONOX (normal boot)
# -------------------------------------------------------
menuentry "MONOX Kernel v1.0.0 'Singleblaze'" --class monox --class gnu-linux {
    insmod all_video
    insmod gfxterm
    insmod gfxmenu

    # Load kernel
    # ARM64: GRUB loads ELF or Image format
    # DTB is passed automatically by UEFI/GRUB on ARM64

    if [ "$os_ready" = "0" ]; then
        echo ""
        echo "  ERROR: MONOX Kernel is present but no OS userspace was detected."
        echo ""
        echo "  This is the MONOX kernel-only package."
        echo "  To boot successfully, install a MONOX-compatible userspace."
        echo ""
        echo "  Halting in 10 seconds..."
        sleep 10
        halt
    fi

    echo "  Booting MONOX..."

    # ARM64 Image boot
    linux   /boot/monox.img console=ttyAMA0,115200 root=/dev/nvme0n1p1 rw quiet
    # DTB auto-detected by GRUB on UEFI ARM64
    # If manual DTB needed: devicetree /boot/device.dtb
    boot
}

# -------------------------------------------------------
# Menuentry: MONOX (debug - verbose)
# -------------------------------------------------------
menuentry "MONOX Kernel (debug mode)" --class monox {
    insmod all_video

    if [ "$os_ready" = "0" ]; then
        echo "ERROR: No OS userspace found. Install a compatible OS."
        sleep 5
        halt
    fi

    linux   /boot/monox.img console=ttyAMA0,115200 root=/dev/nvme0n1p1 rw \
            monox.debug=1 monox.satpam_verbose=1
    boot
}

# -------------------------------------------------------
# Menuentry: Recovery
# -------------------------------------------------------
menuentry "MONOX Recovery Mode" --class recovery {
    insmod all_video
    linux   /boot/monox.img console=ttyAMA0,115200 root=/dev/nvme0n1p1 rw \
            monox.recovery=1 init=/bin/monox-recover
    boot
}

# -------------------------------------------------------
# Menuentry: Reboot / Poweroff
# -------------------------------------------------------
menuentry "Reboot" { reboot }
menuentry "Power Off" { halt }
